gaps:
- id: GAP-01
  topic: Source character encoding
  evidence: MEMBERELIGIBILITY_generated.csv, MEMBERELIGIBILITY.CPY, and MemberEligibilityVO.md
    do not specify charset (e.g. ISO-8859-1 vs EBCDIC).
  owner: MMIS SME
  priority: P1
- id: GAP-02
  topic: CTR-SRVC-DT to serviceDate (YearMonth)
  evidence: Source PIC X(08) at positions 9-16 (MEMBERELIGIBILITY_generated.csv:L3);
    VO serviceDate uses pattern yyyyMM (MemberEligibilityVO.md:L8-L10). Truncation/padding
    rules not stated in artifacts.
  owner: MMIS SME
  priority: P1
- id: GAP-03
  topic: MBR-GNDR-CD width and code normalization
  evidence: Source PIC X(04) at 435-438 (MEMBERELIGIBILITY_generated.csv:L30); VO
    gender @Size(max=1) with pattern [MFU]? (MemberEligibilityVO.md:L126-L129); T-MSIS
    Sex is X(1) per ELG.002.023.
  owner: MMIS SME
  priority: P1
- id: GAP-04
  topic: Race valid value list
  evidence: MBR-RACE-CD mapped to race (ELG.016.213 per data-elements.csv) but no
    CONFIRMED race VVL CSV under rules/eligibility/value-lists/.
  owner: MMIS SME
  priority: P1
- id: GAP-05
  topic: Eligibility termination reason code
  evidence: MBR-TERM-RSN-CD mapped to eligibilityTerminationReasonCode with t_msis_rule
    ELG.005.095 (MEMBERELIGIBILITY_generated.csv:L37; MemberEligibilityVO.md:L157);
    Eligibility Termination Reason List is not present as a CONFIRMED VVL CSV under
    rules/eligibility/value-lists/.
  owner: MMIS SME
  priority: P2
- id: GAP-06
  topic: Federal match code
  evidence: MBR-FED-MCH-CD present in layout (MEMBERELIGIBILITY_generated.csv:L38);
    no CONFIRMED VVL CSV in value-lists/ for federalMatchCode.
  owner: MMIS SME
  priority: P2
- id: GAP-07
  topic: COMP-3 packed decimal decode
  evidence: LTC liability and rate amount fields use PIC S9(7)V99 COMP-3; VO uses
    @Digits(integer=7, fraction=2) but byte order/sign nibble rules not documented
    in copybook or VO.
  owner: MMIS SME
  priority: P1
- id: GAP-08
  topic: HH-SIZE-NUM binary COMP
  evidence: Source PIC 9(04) COMP (2 bytes) at 1422-1423 (MEMBERELIGIBILITY_generated.csv:L110);
    VO householdSize is Integer (MemberEligibilityVO.md:L461-L462); COMP endianness
    not stated in MEMBERELIGIBILITY.CPY.
  owner: MMIS SME
  priority: P2
- id: GAP-09
  topic: Sentinel / default dates
  evidence: Multiple PIC X(08) date fields in layout; VO @JsonFormat yyyyMMdd on date
    fields without documented sentinel handling (e.g. 00000000, 99999999) in artifacts.
  owner: MMIS SME
  priority: P2
- id: GAP-10
  topic: Phone number formatting
  evidence: MBR-PHN-NUM and related fields PIC X(12) in source; VO memberContactNumber
    @Size(max=10) (MemberEligibilityVO.md:L105-L107). Strip/pad rules not stated.
  owner: MMIS SME
  priority: P2
- id: GAP-11
  topic: Record framing and file terminator
  evidence: MEMBERELIGIBILITY_generated.csv defines a 1473-byte fixed layout (SRC-FILE-NM
    ends at 1473); no LF/CRLF, RDW, or block descriptor documented in .CPY or VO.
  owner: MMIS SME
  priority: P1
- id: GAP-12
  topic: HIPAA / PHI handling for DLQ records
  evidence: MEMBERELIGIBILITY layout and MemberEligibilityVO.md contain SSN and demographic
    PHI; no dead-letter redaction or retention policy in provided artifacts.
  owner: Sec/Compliance
  priority: P1
- id: GAP-13
  topic: CMdS operations (API contract, file arrival, SLA, observability)
  evidence: Integration project provides MemberEligibilityVO.md only; no OpenAPI contract,
    batch file arrival, SLA, or observability artifacts.
  owner: CMdS API
  priority: P2
- id: GAP-14
  topic: Natural-key format and validation
  evidence: No composite ingest key (e.g. medicaidCardId + serviceDate + providerId)
    documented in MEMBERELIGIBILITY_generated.csv, .CPY, or MemberEligibilityVO.md.
  owner: MMIS SME
  priority: P2
- id: GAP-15
  topic: Cross-field date ordering rules
  evidence: T-MSIS data-elements.md documents period ordering for many date pairs;
    integration artifacts do not state which pairs apply at the MES→CMdS boundary.
  owner: MMIS SME
  priority: P2
- id: GAP-16
  topic: Veterans indicator code normalization
  evidence: T-MSIS Veteran Indicator List uses codes 0/1 (veteran-indicator.csv);
    VO veteransIndicator pattern [YN]? (MemberEligibilityVO.md:L448-L451). Mapping
    not stated in artifacts.
  owner: MMIS SME
  priority: P2
- id: GAP-17
  topic: Level of care code width
  evidence: Source LTC-LVL-CARE-CD PIC X(04) at 531-534 (MEMBERELIGIBILITY_generated.csv:L45);
    VO levelOfCare @Size(max=2) (MemberEligibilityVO.md:L191-L193); T-MSIS ELG.005.088
    is X(3). Truncation/padding rules not stated.
  owner: MMIS SME
  priority: P2
- id: GAP-18
  topic: Marital status code width
  evidence: Source MRTL-STAT-CD PIC X(04) at 1380-1383 (MEMBERELIGIBILITY_generated.csv:L106);
    VO maritalStatus @Size(max=1) (MemberEligibilityVO.md:L444-L446); T-MSIS ELG.003.034
    uses 2-character codes (marital-status.csv). Normalization not stated.
  owner: MMIS SME
  priority: P2
- id: GAP-19
  topic: Disability type code list
  evidence: MBR-DSBL-TYP mapped to diabilityType with t_msis_rule ELG.017.224 (MEMBERELIGIBILITY_generated.csv:L33;
    MemberEligibilityVO.md:L139); Disability Type Code List is not present as a CONFIRMED
    VVL CSV under rules/eligibility/value-lists/.
  owner: MMIS SME
  priority: P2
- id: GAP-20
  topic: Health home level code list
  evidence: HH-LVL-CD present in layout (MEMBERELIGIBILITY_generated.csv:L42) mapped
    to healthHomeLevelCode (MemberEligibilityVO.md:L178); no CONFIRMED VVL CSV under
    rules/eligibility/value-lists/.
  owner: MMIS SME
  priority: P2
- id: GAP-21
  topic: Part D opt-out indicator legal values
  evidence: MCR-PTD-OPT-IND present in layout (MEMBERELIGIBILITY_generated.csv:L65)
    mapped to partDOptOutIndex (MemberEligibilityVO.md:L273); Boolean/indicator legal
    values (Y/N, 1/0, blank) not stated in MEMBERELIGIBILITY_generated.csv, .CPY,
    or VO.
  owner: MMIS SME
  priority: P2
- id: GAP-22
  topic: Lock-in assignment reason code list
  evidence: LCK-ASGN-RSN present in layout (MEMBERELIGIBILITY_generated.csv:L98) mapped
    to lockinAssignmentReasonCode (MemberEligibilityVO.md:L409); no CONFIRMED VVL
    CSV under rules/eligibility/value-lists/.
  owner: MMIS SME
  priority: P2
- id: GAP-23
  topic: Lock-in change reason code list
  evidence: LCK-CHG-RSN present in layout (MEMBERELIGIBILITY_generated.csv:L99) mapped
    to lockinChangeReasonCode (MemberEligibilityVO.md:L413); no CONFIRMED VVL CSV
    under rules/eligibility/value-lists/.
  owner: MMIS SME
  priority: P2
- id: GAP-24
  topic: Immigrant admission status code list
  evidence: IMM-ADMS-STAT mapped to immigrantAdmissionStatus with t_msis_rule ELG.003.042
    (MEMBERELIGIBILITY_generated.csv:L111; MemberEligibilityVO.md:L464); Immigration
    Status List is not present as a CONFIRMED VVL CSV under rules/eligibility/value-lists/.
  owner: MMIS SME
  priority: P2
- id: GAP-25
  topic: Per-field nullability / mandatory rules
  evidence: VO has sparse nullability comments (e.g. medicareIdNumber, healthHomeNPIId);
    T-MSIS Necessity in data-elements.md is not aligned field-by-field to MES layout
    or JSR-380 constraints in MemberEligibilityVO.md.
  owner: MMIS SME
  priority: P2
- id: GAP-26
  topic: Name / free-text character class
  evidence: Name and address PIC X fields (e.g. MBR-LAST-NM, MBR-FRST-NM) have no
    allowed character class documented in MEMBERELIGIBILITY_generated.csv, .CPY, or
    MemberEligibilityVO.md beyond @Size.
  owner: MMIS SME
  priority: P3
