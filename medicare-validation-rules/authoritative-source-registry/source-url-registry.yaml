# Canonical URLs and domain allowlists for Medicare-Authoritative-Source-Registry.csv
# Agent MUST NOT fetch from domains not listed here.
# Update this file when the CSV registry changes.

registry_csv: Medicare-Authoritative-Source-Registry.csv
version: "1.0.0"

authority_tiers:
  tier_1:
    label: Binding authority
    description: Federal law, CFR, Federal Register, CMS/CMCS guidance, approved SPAs, approved waivers
  tier_2:
    label: Operational authority
    description: DMAS manuals, memos/bulletins, MCO contracts, fee schedules, provider downloads
  tier_3:
    label: Standards authority
    description: T-MSIS, X12, NCPDP, HL7/FHIR, CAQH CORE, NUCC, NPPES, HCPCS, ICD
  tier_4:
    label: Interpretive/reference
    description: ResDAC, MACPAC — secondary; cite as interpretive, not primary

sources:
  # --- Federal ---
  - id: federal-medicaid-gov
    name: Medicaid.gov
    jurisdiction: federal
    tier: tier_1
    domains: [www.medicaid.gov, medicaid.gov]
    entry_urls:
      - https://www.medicaid.gov/
    use_for: [policy, eligibility, benefits, managed_care, program_integrity, waivers]
    crawlable: true

  - id: federal-cms-cmcs-guidance
    name: CMS / CMCS Federal Policy Guidance
    jurisdiction: federal
    tier: tier_1
    domains: [www.medicaid.gov]
    entry_urls:
      - https://www.medicaid.gov/medicaid/regulations/guidance-for-states/index.html
    use_for: [policy, guidance, director_letters, bulletins]
    crawlable: true

  - id: federal-t-msis
    name: T-MSIS Data Guide
    jurisdiction: federal
    tier: tier_3
    domains: [www.medicaid.gov, download.medicaid.gov]
    entry_urls:
      - https://www.medicaid.gov/medicaid/data-and-systems/macbis/t-msis/tmsis-dictionary/index.html
      - https://www.medicaid.gov/medicaid/data-and-systems/macbis/t-msis/tmsis-data-guide/index.html
    use_for: [member, provider, claims, managed_care, tpl, eligibility, file_layout, data_dictionary, rules, value_lists]
    crawlable: true
    priority_for: [entity_lookup, lov_lookup, rule_lookup, standard_updates]

  - id: federal-data-medicaid-gov
    name: Data.Medicaid.gov
    jurisdiction: federal
    tier: tier_3
    domains: [data.medicaid.gov]
